<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Orbit Ring around camera -->
  <ellipse cx="32" cy="33" rx="24" ry="10.5" transform="rotate(-25 32 33)" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="72 8" opacity="0.9" />

  <!-- Orbit Sparkle -->
  <circle cx="50" cy="22" r="2.5" fill="#38bdf8" />

  <!-- Camera Viewfinder / Top bump -->
  <path d="M26 21.5H38L41 25.5H23L26 21.5Z" fill="#ffffff" />
  
  <!-- Camera Body -->
  <rect x="15" y="24.5" width="34" height="23" rx="5" fill="#ffffff" />

  <!-- Flash LED -->
  <circle cx="43" cy="29" r="2" fill="#6366f1" />

  <!-- Lens Outer Rim -->
  <circle cx="32" cy="36" r="8" fill="#4f46e5" />

  <!-- Lens Aperture -->
  <circle cx="32" cy="36" r="5.5" fill="#0f172a" />

  <!-- Lens Cyan Reflection -->
  <circle cx="30" cy="34" r="2.2" fill="#38bdf8" />
</svg>